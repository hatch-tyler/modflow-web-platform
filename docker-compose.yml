services:
  # =============================================================================
  # NGINX Reverse Proxy
  # =============================================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: modflow-nginx
    # Preflight: if the host bind mount is detached, Docker materialises an
    # empty directory at /etc/nginx/nginx.conf and nginx dies on a confusing
    # "is a directory" error. Wait for the real file instead.
    command: >
      sh -c 'n=0;
      while [ ! -f /etc/nginx/nginx.conf ]; do
      n=$$((n+1));
      if [ $$n = 1 ]; then echo "PREFLIGHT FATAL: /etc/nginx/nginx.conf is not a regular file - the host bind mount is not attached. This project lives on external USB SSD D: (exFAT); if that drive dropped, ./nginx/nginx.conf resolves to an empty directory. Reconnect D: and this container will start automatically."; fi;
      if [ $$(($$n % 12)) = 0 ]; then echo "PREFLIGHT: still waiting for nginx.conf bind mount ($$(($$n * 5))s elapsed)"; fi;
      sleep 5;
      done;
      echo "PREFLIGHT OK: /etc/nginx/nginx.conf found";
      exec nginx -g "daemon off;"'
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    # service_started, NOT service_healthy: nginx only needs the upstream
    # names to resolve at startup. Gating on health meant that if EITHER api
    # or frontend was unhealthy, nginx never started and the entire app was
    # unreachable — instead of nginx serving the healthy half and returning
    # 502 for the sick one.
    depends_on:
      api:
        condition: service_started
      frontend:
        condition: service_started
    networks:
      - modflow-network
    restart: unless-stopped
    labels:
      - autoheal=true
    # Probes nginx ITSELF, never an upstream. /health is a `return 200` in
    # conf.d/default.conf with no proxy_pass, so this reports on nginx's own
    # worker processes and config only. Pointing it at a proxied route would
    # make a sick api or frontend mark nginx unhealthy and have autoheal
    # restart it pointlessly — re-coupling exactly what depends_on:
    # service_started above was changed to decouple.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # =============================================================================
  # Frontend (React SPA - Vite dev server)
  # =============================================================================
  frontend:
    image: node:20.18-alpine
    container_name: modflow-frontend
    working_dir: /app
    # Preflight guards against the host bind mount being detached (see the
    # PREFLIGHT note at the bottom of this file). Without it, an empty /app
    # makes `npm install` exit 254 in a tight restart loop with no clue why.
    # npm ci only re-runs when the lockfile is newer than the last install,
    # so normal restarts no longer depend on the npm registry being reachable.
    command: >
      sh -c 'n=0;
      while [ ! -f /app/package.json ]; do
      n=$$((n+1));
      if [ $$n = 1 ]; then echo "PREFLIGHT FATAL: /app/package.json missing - the host bind mount is not attached. This project lives on external USB SSD D: (exFAT); if that drive dropped or re-enumerated, ./frontend resolves to an empty directory. Reconnect D: and this container will start automatically."; fi;
      if [ $$(($$n % 12)) = 0 ]; then echo "PREFLIGHT: still waiting for /app bind mount ($$(($$n * 5))s elapsed)"; fi;
      sleep 5;
      done;
      echo "PREFLIGHT OK: /app/package.json found";
      if [ ! -x node_modules/.bin/vite ] || [ package-lock.json -nt node_modules/.install-stamp ]; then
      echo "Installing dependencies (node_modules missing or lockfile changed)";
      npm ci && touch node_modules/.install-stamp;
      else echo "Dependencies up to date - skipping npm ci"; fi;
      exec npm run dev -- --port 5173 --host 0.0.0.0'
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    expose:
      - "5173"
    networks:
      - modflow-network
    restart: unless-stopped
    labels:
      # Opt in to autoheal (which is now label-scoped, not "all")
      - autoheal=true
    environment:
      - NODE_OPTIONS=--max-old-space-size=1536
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # =============================================================================
  # Database Migrations (runs before API starts)
  # =============================================================================
  db-migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: modflow-db-migrate
    command: >
      sh -c "alembic upgrade head 2>&1 || echo 'Migration skipped (no alembic config or already up to date)'"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-modflow}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-modflow_secret}
      - POSTGRES_DB=${POSTGRES_DB:-modflow_db}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - modflow-network
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 256M

  # =============================================================================
  # Backend API (FastAPI)
  # =============================================================================
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: modflow-api
    # init: true injects tini as PID 1 to properly reap zombie children.
    # Without this, uvicorn's reloader runs as PID 1 and cannot reap its
    # worker subprocess if it crashes, leaving a zombie and a hung server.
    init: true
    # Preflight: with an empty /app, `uvicorn --reload` does NOT exit — the
    # reloader sits alive with a dead worker, so the container never becomes
    # healthy and nginx never comes up. Block with a clear message instead.
    command: >
      sh -c 'n=0;
      while [ ! -f /app/app/main.py ]; do
      n=$$((n+1));
      if [ $$n = 1 ]; then echo "PREFLIGHT FATAL: /app/app/main.py missing - the host bind mount is not attached. This project lives on external USB SSD D: (exFAT); if that drive dropped or re-enumerated, ./backend resolves to an empty directory. Reconnect D: and this container will start automatically."; fi;
      if [ $$(($$n % 12)) = 0 ]; then echo "PREFLIGHT: still waiting for /app bind mount ($$(($$n * 5))s elapsed)"; fi;
      sleep 5;
      done;
      echo "PREFLIGHT OK: /app/app/main.py found";
      exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload'
    volumes:
      - ./backend:/app
    expose:
      - "8000"
    environment:
      - DEBUG=true
      - HEALTH_CHECK_MODE=api
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-modflow}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-modflow_secret}
      - POSTGRES_DB=${POSTGRES_DB:-modflow_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_secret}
      - MINIO_HOST=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      # Separate Redis for cache (slice cache, live results)
      - REDIS_CACHE_HOST=redis-cache
      - REDIS_CACHE_PORT=6379
      - REDIS_CACHE_PASSWORD=${REDIS_CACHE_PASSWORD:-redis_secret}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - modflow-network
    restart: unless-stopped
    labels:
      # Opt in to autoheal (which is now label-scoped, not "all")
      - autoheal=true
    # Override Dockerfile health check with more appropriate timing
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py", "api"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # =============================================================================
  # Celery Worker (Background Tasks - Simulations & Post-processing)
  # =============================================================================
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: modflow-worker
    init: true  # Proper zombie reaping for MODFLOW subprocesses
    # Concurrency=1 to prevent OOM on large models; increase if you have more RAM
    # Soft time limit not set — simulations can run hours. Graceful shutdown handled via SIGTERM.
    # Preflight: with an empty /app, celery cannot import `celery_app` and
    # exits 2 in a tight restart loop. Block with a clear message instead.
    command: >
      sh -c 'n=0;
      while [ ! -f /app/celery_app.py ]; do
      n=$$((n+1));
      if [ $$n = 1 ]; then echo "PREFLIGHT FATAL: /app/celery_app.py missing - the host bind mount is not attached. This project lives on external USB SSD D: (exFAT); if that drive dropped or re-enumerated, ./backend resolves to an empty directory. Reconnect D: and this container will start automatically."; fi;
      if [ $$(($$n % 12)) = 0 ]; then echo "PREFLIGHT: still waiting for /app bind mount ($$(($$n * 5))s elapsed)"; fi;
      sleep 5;
      done;
      echo "PREFLIGHT OK: /app/celery_app.py found";
      exec celery -A celery_app worker --loglevel=info --concurrency=1'
    stop_grace_period: 1800s  # 30 min grace period for long-running simulations on docker stop
    volumes:
      - ./backend:/app
      - worker-data:/tmp/modflow-runs
      # Shared workspace for local PEST++ agent containers
      - pest-workspace:/tmp/pest-workspace
    environment:
      - DEBUG=true
      - HEALTH_CHECK_MODE=worker
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-modflow}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-modflow_secret}
      - POSTGRES_DB=${POSTGRES_DB:-modflow_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_secret}
      - MINIO_HOST=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      # Separate Redis for cache (slice cache, live results)
      - REDIS_CACHE_HOST=redis-cache
      - REDIS_CACHE_PORT=6379
      - REDIS_CACHE_PASSWORD=${REDIS_CACHE_PASSWORD:-redis_secret}
      # PEST++ parallel execution settings
      - PEST_NETWORK_MODE=${PEST_NETWORK_MODE:-false}
      - PEST_MANAGER_PORT=${PEST_MANAGER_PORT:-4004}
      - PEST_LOCAL_CONTAINERS=${PEST_LOCAL_CONTAINERS:-false}
      - PEST_LOCAL_AGENTS=${PEST_LOCAL_AGENTS:-4}
      - PEST_WORKSPACE_PATH=/tmp/pest-workspace
    ports:
      # PEST++ manager port for remote agents (only used when PEST_NETWORK_MODE=true)
      - "${PEST_MANAGER_PORT:-4004}:4004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - modflow-network
    restart: unless-stopped
    labels:
      - autoheal=true
      # CRITICAL: autoheal restarts via the Docker API with a stop timeout.
      # Its default is 10s, which SIGKILLs a running MODFLOW simulation 10s
      # after any unhealthy blip and silently defeats stop_grace_period above.
      # Match the grace period so a restart lets the simulation wind down.
      - autoheal.stop.timeout=1800
    # Worker health = "can Celery actually accept work", not "is Redis up".
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py", "worker"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3G
        reservations:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # =============================================================================
  # PostgreSQL Database
  # =============================================================================
  postgres:
    image: timescale/timescaledb:2.25.0-pg16
    container_name: modflow-postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-modflow}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-modflow_secret}
      - POSTGRES_DB=${POSTGRES_DB:-modflow_db}
    expose:
      - "5432"
    ports:
      - "5432:5432"  # Expose for local development
    networks:
      - modflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-modflow} -d ${POSTGRES_DB:-modflow_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    labels:
      # Scoped autoheal opt-in (previously covered implicitly by
      # AUTOHEAL_CONTAINER_LABEL=all, which also reached other projects).
      - autoheal=true
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # =============================================================================
  # Redis Broker (Celery task queue — noeviction to prevent silent job loss)
  # =============================================================================
  redis:
    image: redis:7.4-alpine
    container_name: modflow-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret} --maxmemory 150mb --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    expose:
      - "6379"
    ports:
      - "6379:6379"  # Expose for local development
    networks:
      - modflow-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    labels:
      # Scoped autoheal opt-in (previously covered implicitly by
      # AUTOHEAL_CONTAINER_LABEL=all, which also reached other projects).
      - autoheal=true
    deploy:
      resources:
        limits:
          memory: 192M
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # =============================================================================
  # Redis Cache (slice cache, live results — allkeys-lru for safe eviction)
  # =============================================================================
  redis-cache:
    image: redis:7.4-alpine
    container_name: modflow-redis-cache
    command: redis-server --requirepass ${REDIS_CACHE_PASSWORD:-redis_secret} --maxmemory 150mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-cache-data:/data
    expose:
      - "6379"
    ports:
      - "6380:6379"  # Expose for local development
    networks:
      - modflow-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_CACHE_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    labels:
      # Scoped autoheal opt-in (previously covered implicitly by
      # AUTOHEAL_CONTAINER_LABEL=all, which also reached other projects).
      - autoheal=true
    deploy:
      resources:
        limits:
          memory: 192M
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # =============================================================================
  # MinIO Object Storage
  # =============================================================================
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: modflow-minio
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
    expose:
      - "9000"
      - "9001"
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    networks:
      - modflow-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    labels:
      # Scoped autoheal opt-in (previously covered implicitly by
      # AUTOHEAL_CONTAINER_LABEL=all, which also reached other projects).
      - autoheal=true
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # =============================================================================
  # Autoheal — restarts containers marked "unhealthy" by Docker health checks.
  # Docker Compose "restart: unless-stopped" only restarts on process EXIT,
  # not on unhealthy status. This sidecar bridges the gap.
  # =============================================================================
  autoheal:
    image: willfarrell/autoheal
    container_name: modflow-autoheal
    restart: unless-stopped
    environment:
      # Was "all", which made this sidecar restart ANY unhealthy container on
      # the host — including containers belonging to unrelated projects.
      # Label-scoped opt-in: only services carrying `autoheal=true` above.
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=120
      # Per-container overrides come from the `autoheal.stop.timeout` label;
      # the worker sets 1800 so simulations are not SIGKILLed mid-run.
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      resources:
        limits:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

# =============================================================================
# Networks
# =============================================================================
networks:
  modflow-network:
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres-data:
  redis-data:
  redis-cache-data:
  minio-data:
  worker-data:
  frontend-node-modules:
  # Shared workspace for local PEST++ agent containers
  pest-workspace:
    name: pest-workspace

# =============================================================================
# PREFLIGHT / EXTERNAL DRIVE NOTE
# =============================================================================
# This project lives on D:\, a Samsung PSSD T5 EVO — an EXTERNAL USB SSD
# formatted exFAT. Every service that bind-mounts from D:\ (nginx, frontend,
# api, worker) depends on that drive staying attached. If D: drops or
# re-enumerates (sleep/resume, USB power management, cable), Docker Desktop
# resolves those bind mounts to an EMPTY DIRECTORY. The containers keep
# running but see an empty /app.
#
# Observed 2026-09-18, and the exit codes are reproducible:
#   frontend  empty /app -> `npm install` exits 254
#   worker    empty /app -> celery cannot import celery_app, exits 2
#   api       empty /app -> `uvicorn --reload` HANGS (never exits, never healthy)
#   nginx     empty mount -> nginx.conf is a directory, fails to start
# Services using only named volumes (postgres, redis, redis-cache, minio) are
# unaffected and stay up — that asymmetry is the diagnostic fingerprint.
#
# The `command:` preflight on each of those four services now blocks with a
# loud, explicit message and retries every 5s, so a detached drive produces a
# readable log line instead of a silent crash loop — and the stack recovers on
# its own once D: is reconnected, with no `docker-compose down` needed.
#
# Quick check when things look wrong:
#   docker inspect modflow-worker --format '{{range .Mounts}}{{.Source}}{{end}}'
#   docker logs modflow-worker 2>&1 | grep PREFLIGHT
